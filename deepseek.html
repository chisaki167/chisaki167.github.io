<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/jpeg" href="ava.jpg">
<title>Trợ Lý DeepSeek Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="index1.css">
</head>
<body>

<svg style="display:none;position:absolute;" xmlns="http://www.w3.org/2000/svg">
  <filter id="container-glass" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" id="glassDisplacement" />
  </filter>
</svg>

<button class="bg-toggle-btn" id="fullscreenBtn" type="button" onclick="toggleFullscreen()">🛈 Toàn màn hình: Tắt</button>

<div class="top-left-profile">
  <img src="ava.jpg" alt="Avatar" class="user-avatar" onerror="this.src='https://via.placeholder.com/32'">
  <span class="user-name">chisaki167</span>
</div>

<div class="top-right-controls" style="display:flex; gap:8px;">
  <button class="bg-toggle-btn" id="ttsToggleBtn" onclick="toggleTTS()">🔊 Giọng đọc: Bật</button>
  <button class="bg-toggle-btn" id="bgToggleBtn" onclick="toggleBackground()">🎬 Nền: Tắt</button>
</div>

<video class="bg-video hidden" id="bgVideo" autoplay muted loop playsinline>
  <source src="background.mp4" type="video/mp4">
</video>
<div class="bg-overlay hidden" id="bgOverlay"></div>

<main class="wrap">
  <header class="profile">
    <h1>Trợ Lý <span class="highlight">DeepSeek Voice AI</span></h1>
    <h2>Trò chuyện bằng giọng nói, văn bản & hình ảnh thông minh</h2>
  </header>

  <div class="card">
    <div class="gemini-container">
      <div class="gemini-icon-glow">
        <i class="fa-solid fa-microphone-lines"></i>
      </div>

      <div>
        <h3 style="font-size: 1.25rem; color: var(--ink); margin-bottom: 6px; font-family: var(--font-display);">Cấu hình API & Tương tác</h3>
        <p style="color: var(--muted); font-size: 0.9rem;">Nhập API Key, dán/tải ảnh trực tiếp, bấm ghi âm hoặc nhập văn bản để trò chuyện.</p>
      </div>

      <div class="api-key-box">
        <i class="fa-solid fa-key" style="color: var(--muted); margin-left: 4px;"></i>
        <input type="password" id="apiKeyInput" placeholder="Dán DeepSeek / OpenRouter API Key..." />
        <button class="save-key-btn" onclick="saveApiKey()">Lưu Key</button>
      </div>

      <div class="quick-input-area">
        <div id="imagePreviewContainer" class="image-preview-container">
          <img id="imagePreview" src="" alt="Preview">
          <span id="imageName" style="font-size: 0.8rem; color: var(--ink);"></span>
          <button class="remove-img-btn" onclick="removeImage()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="input-row">
          <textarea id="promptInput" placeholder="Nhập câu hỏi, dán ảnh (Ctrl+V) hoặc nói..." rows="2"></textarea>
          <div class="btn-group">
            <button class="upload-btn" onclick="document.getElementById('imageInput').click()" title="Chọn ảnh">
              <i class="fa-solid fa-image"></i>
            </button>
            <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">
            <button class="record-btn" id="recordBtn" onclick="toggleRecord()" title="Bấm để nói chuyện">
              <i class="fa-solid fa-microphone" id="micIcon"></i>
            </button>
            <button class="quick-send-btn" onclick="sendToDeepSeek()">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </div>
        </div>
      </div>

      <div id="statusText" class="status-text">Sẵn sàng kết nối.</div>

      <div id="conversationBox" class="conversation-box" style="display: none;"></div>
    </div>
  </div>
</main>

<footer>Trang Trợ Lý AI · Github by chisaki167</footer>

<script src="deepseek.js"></script>
<script src="67.js"></script>
</body>
</html>
