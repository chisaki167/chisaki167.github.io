<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Github by chisaki167</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Bộ lọc SVG dùng để tạo hiệu ứng Liquid Glass lỏng thực tế -->
<svg style="display:none; position:absolute;" xmlns="http://www.w3.org/2000/svg">
  <filter id="container-glass" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" id="glassDisplacement" />
  </filter>
</svg>

<button class="bg-toggle-btn" id="bgToggleBtn" onclick="toggleBackground()">
  <span>🎬 Nền: Bật</span>
</button>

<video class="bg-video" id="bgVideo" autoplay muted loop playsinline>
  <source src="background.mp4" type="video/mp4">
  Trình duyệt của bạn không hỗ trợ thẻ video.
</video>
<div class="bg-overlay" id="bgOverlay"></div>

<header class="profile wrap">
  <div class="avatar">
    <img src="ava.jpg" alt="Avatar">
  </div>
  <h1>chisaki167 <span class="highlight">Bio</span></h1>
  <p class="bio-desc">Kho lưu trữ cá nhân chuyên chia sẻ Mods, ResourcePacks, Litematica và Maps cho Minecraft Java.</p>
</header>

<div class="wrap filter-container">
  <!-- Áp dụng class glassContainer vào thanh menu -->
  <div class="filter-tabs glassContainer" id="filterTabs">
    <div class="liquid-pill" id="liquidPill"></div>
    <button class="filter-btn glassBtn active" data-index="0" onclick="filterItems('all', event)">Tất cả</button>
    <button class="filter-btn glassBtn" data-index="1" onclick="filterItems('mod', event)">Mods</button>
    <button class="filter-btn glassBtn" data-index="2" onclick="filterItems('rsp', event)">Resource Packs (RSP)</button>
    <button class="filter-btn glassBtn" data-index="3" onclick="filterItems('litematica', event)">Litematica</button>
    <button class="filter-btn glassBtn" data-index="4" onclick="filterItems('map', event)">Maps</button>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm..." oninput="handleSearch()">
    </div>
  </div>
</div>

<main class="content wrap" id="itemGrid">
  <div class="loading">Đang tải danh sách tài nguyên...</div>
</main>

<footer class="wrap">
  Minecraft Java  ·  Github by chisaki167  ·  Bản thử nghiệm
</footer>

<script src="animation.js"></script>
</body>
</html>
