<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minecraft Java Hub · Github by chisaki167</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<style>

:root {
  color-scheme: light;
  --bg: #F4F7FC;
  --surface: rgba(255, 255, 255, 0.78);
  --surface-solid: #FFFFFF;
  --ink: #0F172A;
  --muted: #475569;
  --line: rgba(255, 255, 255, 0.6);
  --line-solid: #CBD5E1;
  --accent: #2563EB;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(37, 99, 235, 0.1);
  --amber: #D97706;
  --amber-soft: rgba(217, 119, 6, 0.1);
  --good: #059669;
  --good-soft: rgba(5, 150, 105, 0.1);
  --purple: #7C3AED;
  --purple-soft: rgba(124, 58, 237, 0.1);
  --glass-border: 1px solid rgba(255, 255, 255, 0.9);
  --shadow-glass: 0 10px 30px 0 rgba(31, 38, 135, 0.07);
  --shadow-hover: 0 20px 40px 0 rgba(31, 38, 135, 0.12);
  --inner-glow: inset 0 1px 0 0 rgba(255, 255, 255, 0.9);
  --font-display: "Lexend", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
  --r: 20px;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  background-color: var(--bg);
  background-image: 
    radial-gradient(at 10% 10%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
    radial-gradient(at 90% 90%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
  background-attachment: fixed;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.wrap { max-width: 950px; margin: 0 auto; padding-inline: 20px; width: 100%; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.25; margin: 0; }
p { margin: 0; }
a { text-decoration: none; color: inherit; }

/* Header Profile Bio */
header.profile { padding-block: 50px 30px; text-align: center; display: grid; gap: 12px; place-items: center; }
.avatar {
  width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--accent);
  background: var(--surface); box-shadow: 0 8px 20px var(--accent-soft);
  overflow: hidden; display: grid; place-items: center;
}
.avatar img {
  width: 100%; height: 100%; object-fit: cover;
}
.profile h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); }
.profile h1 .highlight { color: var(--accent); }
.bio-desc { color: var(--muted); max-width: 500px; font-size: 1.05rem; }

/* Thanh trượt danh mục Liquid Glass Slider */
.filter-container { 
  display: flex; 
  justify-content: center; 
  margin-bottom: 28px; 
  overflow-x: auto; 
  padding-bottom: 8px;
  scrollbar-width: none; 
}
.filter-container::-webkit-scrollbar { display: none; }

.filter-tabs {
  display: inline-flex;
  background: var(--surface);
  border: var(--glass-border);
  border-radius: 999px;
  padding: 6px;
  gap: 6px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow-glass), var(--inner-glow);
  white-space: nowrap;
}
.filter-btn {
  background: transparent; border: none; color: var(--muted);
  padding: 10px 22px; border-radius: 999px; font-weight: 600; font-size: 0.9rem;
  cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  flex-shrink: 0;
}
.filter-btn:hover { color: var(--ink); }
.filter-btn.active {
  background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 4px 15px var(--accent-soft);
}

/* Grid Cards */
main.content { padding-bottom: 50px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 20px; }

.card {
  background: var(--surface);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: var(--glass-border);
  box-shadow: var(--shadow-glass), var(--inner-glow);
  border-radius: var(--r);
  padding: 24px; display: grid; gap: 14px;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover), var(--inner-glow);
  border-color: var(--accent);
}
.card-header { display: flex; justify-content: space-between; align-items: center; }
.badge {
  display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px;
}
.badge.mod { background: var(--accent-soft); color: var(--accent); }
.badge.rsp { background: var(--amber-soft); color: var(--amber); }
.badge.litematica { background: var(--purple-soft); color: var(--purple); }
.badge.map { background: var(--good-soft); color: var(--good); }

.card h2 { font-size: 1.15rem; word-break: break-word; }
.card p { color: var(--muted); font-size: 0.9rem; word-break: break-all; }
.card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--line-solid); }
.version { font-size: 0.85rem; color: var(--muted); font-family: monospace; }
.btn-dl {
  background: var(--accent); color: var(--accent-ink); padding: 6px 14px; border-radius: 10px; font-weight: 600; font-size: 0.85rem;
  transition: filter 0.2s;
  box-shadow: 0 4px 12px var(--accent-soft);
}
.btn-dl:hover { filter: brightness(1.1); }

footer { color: var(--muted); font-size: .85rem; padding-block: 24px; text-align: center; border-top: 1px solid var(--line-solid); }
.loading { text-align: center; color: var(--muted); grid-column: 1 / -1; padding: 40px; font-weight: 500; }
</style>
</head>
<body>

<header class="profile wrap">
  <div class="avatar">
    <img src="ava.jpg" alt="Avatar">
  </div>
  <h1>chisaki167 <span class="highlight">MC Hub</span></h1>
  <p class="bio-desc">Kho lưu trữ cá nhân chuyên chia sẻ Mods, Resource Packs (RSP), Litematica và Maps cho Minecraft Java Edition.</p>
</header>

<div class="wrap filter-container">
  <div class="filter-tabs">
    <button class="filter-btn active" onclick="filterItems('all', event)">Tất cả</button>
    <button class="filter-btn" onclick="filterItems('mod', event)">Mods</button>
    <button class="filter-btn" onclick="filterItems('rsp', event)">Resource Packs (RSP)</button>
    <button class="filter-btn" onclick="filterItems('litematica', event)">Litematica</button>
    <button class="filter-btn" onclick="filterItems('map', event)">Maps</button>
  </div>
</div>

<main class="content wrap" id="itemGrid">
  <div class="loading">Đang tải danh sách tài nguyên...</div>
</main>

<footer class="wrap">
  Minecraft Java Hub · Powered by GitHub API & Liquid Glass Design
</footer>

<script>
// --- CẤU HÌNH THÔNG TIN GITHUB ---
const GITHUB_USER = 'chisaki167';
const GITHUB_REPO = 'chisaki167.github.io'; 

// --- 3 FILE MẪU RESOURCE PACKS (RSP) GẮN LINK GOOGLE DRIVE ---
const MANUAL_RSP_LIST = [
  {
    name: "Resource Pack 1.zip",
    driveUrl: "https://drive.google.com/file/d/1FVI24eQCYtYzjeaYVLBPpwP7sfUlpPII/view?usp=drivesdk"
  },
  {
    name: "Resource Pack 2.zip",
    driveUrl: "https://drive.google.com/file/d/19JFlifbPNEAZx9t6iQ5lPh_Nerh6vY6z/view?usp=drivesdk"
  },
  {
    name: "Resource Pack 3.zip",
    driveUrl: "https://drive.google.com/file/d/1jRp8GNE3T6n0ZrFtRuY9YcwudJ-fmxF3/view?usp=drivesdk"
  }
];

// Hàm phụ trợ chuyển đổi link Google Drive sang định dạng tải xuống trực tiếp
function convertDriveLink(url) {
  const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (match && match[1]) {
    return `https://drive.google.com/uc?export=download&id=${match[1]}`;
  }
  return url;
}

async function fetchFolderContent(folderPath, category, badgeText) {
  try {
    const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${folderPath}?per_page=100`;
    const response = await fetch(apiUrl);
    if (response.ok) {
      const data = await response.json();
      let list = [];
      data.forEach(file => {
        if (file.name.endsWith('.zip') || file.name.endsWith('.litematic') || file.name.endsWith('.jar')) {
          list.push({
            name: file.name,
            category: category,
            badgeText: badgeText,
            download_url: file.download_url,
            size: file.size
          });
        }
      });
      return list;
    }
  } catch (err) {
    console.error(`Lỗi quét thư mục ${folderPath}:`, err);
  }
  return [];
}

async function loadAllContent() {
  const grid = document.getElementById('itemGrid');
  let allItems = [];

  // 1. Lấy danh sách Mods từ GitHub
  const mods = await fetchFolderContent('mods', 'mod', 'Mod');

  // 2. Nạp 3 file Resource Packs cấu hình thủ công qua Google Drive
  const rsps = MANUAL_RSP_LIST.map(rsp => ({
    name: rsp.name,
    category: 'rsp',
    badgeText: 'Resource Pack',
    download_url: convertDriveLink(rsp.driveUrl),
    size: null
  }));

  // 3. Lấy danh sách Litematica từ thư mục 'litematicas' trên GitHub
  const litematics = await fetchFolderContent('litematicas', 'litematica', 'Litematica');

  // 4. Lấy danh sách Maps từ thư mục 'maps' trên GitHub
  const maps = await fetchFolderContent('maps', 'map', 'Map');

  allItems = [...mods, ...rsps, ...litematics, ...maps];

  if (allItems.length === 0) {
    grid.innerHTML = '<div class="loading">Không tìm thấy tài nguyên nào.</div>';
    return;
  }

  let htmlContent = '';
  allItems.forEach(item => {
    const displayName = item.name.substring(0, item.name.lastIndexOf('.')) || item.name;
    const fileSizeMB = item.size ? (item.size / (1024 * 1024)).toFixed(1) : 'Google Drive';

    htmlContent += `
      <div class="card" data-category="${item.category}">
        <div class="card-header">
          <span class="badge ${item.category}">${item.badgeText}</span>
          <span class="version">Java Edition</span>
        </div>
        <h2>${displayName}</h2>
        <p>File: ${item.name}</p>
        <div class="card-footer">
          <span class="version">${fileSizeMB} ${item.size ? 'MB' : ''}</span>
          <a href="${item.download_url}" class="btn-dl" target="_blank" download>Tải xuống →</a>
        </div>
      </div>
    `;
  });

  grid.innerHTML = htmlContent;
}

// Chức năng lọc danh mục mượt mà
function filterItems(category, event) {
  const buttons = document.querySelectorAll('.filter-btn');
  buttons.forEach(btn => btn.classList.remove('active'));
  event.currentTarget.classList.add('active');

  const cards = document.querySelectorAll('.card');
  cards.forEach(card => {
    if (category === 'all' || card.dataset.category === category) {
      card.style.display = 'grid';
    } else {
      card.style.display = 'none';
    }
  });
}

// Khởi chạy
loadAllContent();
</script>

</body>
</html>
