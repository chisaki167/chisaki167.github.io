<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minecraft Java Hub · Github by chisaki167</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<style>

:root {
  color-scheme: light;
  --bg: #F4F7FC;
  --surface: rgba(255, 255, 255, 0.78);
  --surface-solid: #FFFFFF;
  --ink: #0F172A;
  --muted: #475569;
  --line: rgba(255, 255, 255, 0.6);
  --line-solid: #CBD5E1;
  --accent: #2563EB;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(37, 99, 235, 0.1);
  --amber: #D97706;
  --amber-soft: rgba(217, 119, 6, 0.1);
  --good: #059669;
  --good-soft: rgba(5, 150, 105, 0.1);
  --glass-border: 1px solid rgba(255, 255, 255, 0.9);
  --shadow-glass: 0 10px 30px 0 rgba(31, 38, 135, 0.07);
  --shadow-hover: 0 20px 40px 0 rgba(31, 38, 135, 0.12);
  --inner-glow: inset 0 1px 0 0 rgba(255, 255, 255, 0.9);
  --font-display: "Lexend", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
  --r: 20px;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  background-color: var(--bg);
  background-image: 
    radial-gradient(at 10% 10%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
    radial-gradient(at 90% 90%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
  background-attachment: fixed;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.wrap { max-width: 900px; margin: 0 auto; padding-inline: 20px; width: 100%; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.25; margin: 0; }
p { margin: 0; }
a { text-decoration: none; color: inherit; }

/* Header Profile Bio */
header.profile { padding-block: 50px 30px; text-align: center; display: grid; gap: 12px; place-items: center; }
.avatar {
  width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--accent);
  background: var(--surface); box-shadow: 0 8px 20px var(--accent-soft);
  overflow: hidden; display: grid; place-items: center;
}
.avatar img {
  width: 100%; height: 100%; object-fit: cover;
}
.profile h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); }
.profile h1 .highlight { color: var(--accent); }
.bio-desc { color: var(--muted); max-width: 500px; font-size: 1.05rem; }

/* Thanh lọc danh mục liền mạch (Unified Bar) */
.filter-container { display: flex; justify-content: center; margin-bottom: 28px; }
.filter-tabs {
  display: inline-flex;
  background: var(--surface);
  border: var(--glass-border);
  border-radius: 999px;
  padding: 5px;
  gap: 4px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow-glass), var(--inner-glow);
}
.filter-btn {
  background: transparent; border: none; color: var(--muted);
  padding: 10px 20px; border-radius: 999px; font-weight: 600; font-size: 0.9rem;
  cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
}
.filter-btn:hover { color: var(--ink); }
.filter-btn.active {
  background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 4px 15px var(--accent-soft);
}

/* Grid Cards */
main.content { padding-bottom: 50px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 20px; }

.card {
  background: var(--surface);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: var(--glass-border);
  box-shadow: var(--shadow-glass), var(--inner-glow);
  border-radius: var(--r);
  padding: 24px; display: grid; gap: 14px;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover), var(--inner-glow);
  border-color: var(--accent);
}
.card-header { display: flex; justify-content: space-between; align-items: center; }
.badge {
  display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px;
}
.badge.mod { background: var(--accent-soft); color: var(--accent); }
.badge.rsp { background: var(--amber-soft); color: var(--amber); }
.badge.map { background: var(--good-soft); color: var(--good); }

.card h2 { font-size: 1.15rem; word-break: break-word; }
.card p { color: var(--muted); font-size: 0.9rem; word-break: break-all; }
.card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--line-solid); }
.version { font-size: 0.85rem; color: var(--muted); font-family: monospace; }
.btn-dl {
  background: var(--accent); color: var(--accent-ink); padding: 6px 14px; border-radius: 10px; font-weight: 600; font-size: 0.85rem;
  transition: filter 0.2s;
  box-shadow: 0 4px 12px var(--accent-soft);
}
.btn-dl:hover { filter: brightness(1.1); }

footer { color: var(--muted); font-size: .85rem; padding-block: 24px; text-align: center; border-top: 1px solid var(--line-solid); }
.loading { text-align: center; color: var(--muted); grid-column: 1 / -1; padding: 40px; font-weight: 500; }
</style>
</head>
<body>

<header class="profile wrap">
  <div class="avatar">
    <img src="ava.jpg" alt="Avatar">
  </div>
  <h1>chisaki167 <span class="highlight">MC Hub</span></h1>
  <p class="bio-desc">Kho lưu trữ cá nhân chuyên chia sẻ Mods, Resource Packs (RSP) và Maps cho Minecraft Java Edition.</p>
</header>

<div class="wrap filter-container">
  <div class="filter-tabs">
    <button class="filter-btn active" onclick="filterItems('all', event)">Tất cả</button>
    <button class="filter-btn" onclick="filterItems('mod', event)">Mods</button>
    <button class="filter-btn" onclick="filterItems('rsp', event)">Resource Packs (RSP)</button>
    <button class="filter-btn" onclick="filterItems('map', event)">Maps</button>
  </div>
</div>

<main class="content wrap" id="itemGrid">
  <div class="loading">Đang tải danh sách tài nguyên từ GitHub...</div>
</main>

<footer class="wrap">
  Minecraft Java Hub · Powered by GitHub API & Liquid Glass Design
</footer>

<script>
// --- CẤU HÌNH THÔNG TIN GITHUB ---
const GITHUB_USER = 'chisaki167';
const GITHUB_REPO = 'chisaki167.github.io'; 
const FOLDER_PATH = 'mods';      

async function loadMods() {
  const grid = document.getElementById('itemGrid');
  let files = [];

  try {
    // Gọi trực tiếp GitHub API với giới hạn 100 file để lấy đầy đủ kho mod của em
    const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}?per_page=100`;
    const response = await fetch(apiUrl);
    
    if (response.ok) {
      const data = await response.json();
      data.forEach(file => {
        // Chỉ lọc lấy file .jar hoặc .zip
        if (file.name.endsWith('.jar') || file.name.endsWith('.zip')) {
          files.push(file);
        }
      });
    } else {
      throw new Error('Không thể kết nối đến kho lưu trữ GitHub.');
    }
  } catch (err) {
    console.error("Lỗi:", err);
    grid.innerHTML = `<div class="loading" style="color:#DC2626;">Lỗi tải dữ liệu: ${err.message}. Hãy đảm bảo thư mục 'mods' đã tồn tại trên GitHub!</div>`;
    return;
  }

  if (files.length === 0) {
    grid.innerHTML = '<div class="loading">Không tìm thấy file .jar hoặc .zip nào trong thư mục mods trên GitHub.</div>';
    return;
  }

  let htmlContent = '';
  files.forEach(file => {
    // Lấy toàn bộ tên file (bỏ phần đuôi .jar hoặc .zip) làm tên hiển thị
    const modName = file.name.substring(0, file.name.lastIndexOf('.'));

    // Phân loại nhãn dựa vào đuôi file (.zip là Resource Pack, .jar là Mod)
    let category = 'mod';
    let badgeText = 'Mod';
    if (file.name.endsWith('.zip')) {
      category = 'rsp';
      badgeText = 'Resource Pack';
    }

    const fileSizeMB = file.size ? (file.size / (1024 * 1024)).toFixed(1) : '–';

    htmlContent += `
      <div class="card" data-category="${category}">
        <div class="card-header">
          <span class="badge ${category}">${badgeText}</span>
          <span class="version">Java Edition</span>
        </div>
        <h2>${modName}</h2>
        <p>File: ${file.name}</p>
        <div class="card-footer">
          <span class="version">${fileSizeMB} MB</span>
          <a href="${file.download_url}" class="btn-dl" target="_blank" download>Tải xuống →</a>
        </div>
      </div>
    `;
  });

  grid.innerHTML = htmlContent;
}

// Chức năng lọc danh mục mượt mà
function filterItems(category, event) {
  const buttons = document.querySelectorAll('.filter-btn');
  buttons.forEach(btn => btn.classList.remove('active'));
  event.currentTarget.classList.add('active');

  const cards = document.querySelectorAll('.card');
  cards.forEach(card => {
    if (category === 'all' || card.dataset.category === category) {
      card.style.display = 'grid';
    } else {
      card.style.display = 'none';
    }
  });
}

// Khởi chạy tải dữ liệu
loadMods();
</script>

</body>
</html>
